site_name: HealthArchive
site_url: https://jerdaw.github.io/healtharchive/
repo_name: jerdaw/healtharchive
repo_url: https://github.com/jerdaw/healtharchive
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - tags
  - social
  - swagger-ui-tag
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jerdaw/healtharchive
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/healtharchive

exclude_docs: |
  _templates/**
  decisions/**
  documentation-guidelines.md
  documentation-process-audit.md
  deployment/**
  development/playbooks/change-to-production.md
  meta/**
  operations/**
  planning/**
  project.md
  quickstart.md
  roadmap-process.md
  planning/2026-*.md
  planning/implemented/**
  superpowers/**

nav:
  - Home: README.md
  - Project:
      - Architecture: architecture.md
      - API Documentation: api.md
      - API Consumer Guide: api-consumer-guide.md
      - Datasets: datasets-external/README.md
  - Development:
      - Environment Setup: development/dev-environment-setup.md
      - Live Testing: development/live-testing.md
      - Testing Guidelines: development/testing-guidelines.md
      - Database Changes: development/playbooks/database-migrations.md
      - CLI Commands: development/playbooks/add-cli-command.md
  - Tutorials:
      - Your First Contribution: tutorials/first-contribution.md
      - Architecture Walkthrough: tutorials/architecture-walkthrough.md
      - Debugging a Crawl Locally: tutorials/debug-crawl.md
  - Reference:
      - Data Model: reference/data-model.md
      - Archive Tool: reference/archive-tool.md
      - CLI Commands: reference/cli-commands.md
      - Frontend:
          - Overview: frontend/README.md
          - Accessibility Statement: frontend/accessibility.md
          - Accessibility Audit Baseline: frontend/accessibility-audit-2026-07-10.md
          - I18n Guide: frontend/i18n.md
          - Bilingual Development: frontend/development/bilingual-dev-guide.md
          - Local Setup: frontend/development/dev-environment-setup.md
          - Testing: frontend/development/testing-guidelines.md
          - Changelog Process: frontend/changelog-process.md
  - About:
      - Contributing: contributing.md
